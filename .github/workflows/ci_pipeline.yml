name: CI Pipeline - Insurance Cost Prediction

on:
  push:
    branches: [ "master" ] 
  pull_request:
    branches: [ "master" ] 

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Kodları Çek (Checkout)
      uses: actions/checkout@v3

    - name: Python Kurulumu
      uses: actions/setup-python@v4
      with:
        python-version: '3.12' 

    - name: Bağımlılıkları Yükle
      run: |
        python -m pip install --upgrade pip
        pip install flake8 
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Kod Kalite Kontrolü (Linting)
      run: |
        # E501: Satır uzunluğu hatasını yoksay (isteğe bağlı)
        # . : Şu anki klasördeki tüm dosyaları tara
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Docker Build
      run: |
        docker build . --file Dockerfile --tag insurance-prediction-app:latest